[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reading-lab"
version = "0.1.0"
description = "Learn from local books with layered explanations, quizzes and spaced review."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SmallHorseBrother"}]
dependencies = ["openai>=1.30,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
web = ["streamlit>=1.32,<2"]
documents = ["python-docx>=1.1,<2", "PyMuPDF>=1.24,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-reading-lab = "cli:main"

[project.urls]
Repository = "https://github.com/SmallHorseBrother/ai-reading-lab"
Issues = "https://github.com/SmallHorseBrother/ai-reading-lab/issues"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
